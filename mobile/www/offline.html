<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>연결할 수 없습니다 · 빈틈이음</title>
  <style>
    :root { --orange: #f99d26; --orange-dark: #e98a12; --ink: #222; --muted: #737373; }
    html, body { height: 100%; margin: 0; background: #fff; color: var(--ink); }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: -.02em; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 18px 18px 18px 7px; display: grid; place-items: center; background: var(--orange); }
    h1 { margin: 0 0 10px; font-size: 21px; }
    p { margin: 0 0 26px; color: var(--muted); font-size: 15px; line-height: 1.6; }
    button { min-width: 180px; height: 50px; border: 0; border-radius: 12px; background: var(--orange); color: #fff; font: inherit; font-size: 16px; font-weight: 700; }
    button:active { background: var(--orange-dark); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
    <h1>빈틈이음에 연결할 수 없습니다</h1>
    <p>인터넷 연결을 확인한 뒤<br>다시 시도해주세요.</p>
    <button type="button" onclick="location.href='https://my-web-app--gap-seam.us-east4.hosted.app/'">다시 시도</button>
  </main>
</body>
</html>
