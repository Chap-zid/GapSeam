name: CI

# 누가 올린 변경이든 main에 들어가기 전에 lint·타입·빌드를 통과해야 합니다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build가 TypeScript 검사까지 수행합니다.
      # RouteContext 같은 타입은 빌드 중에 생성되므로 tsc를 따로 돌리면 실패합니다.
      # 실제 키 없이도 통과해야 합니다. OPENAI_API_KEY와 VWORD_API_KEY는 런타임 전용이라 CI에 넣지 않습니다.
      - name: 빌드와 타입 검사
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
